<script>
(function() {
  // Cloudflare edge cache mismatch protection:
  // If an obsolete digested theme script fails with a 404/MIME error,
  // force a clean reload so the visitor receives fresh HTML instead of freezing on splash.
  window.addEventListener("error", function(e) {
    if (e.target && e.target.tagName === "SCRIPT" && e.target.src && e.target.src.indexOf("theme-javascripts") !== -1) {
      if (!sessionStorage.getItem("fkb_asset_reloaded")) {
        sessionStorage.setItem("fkb_asset_reloaded", "1");
        window.location.reload(true);
      }
    }
  }, true);

  // Splash timeout failsafe: if splash screen hangs uninitialized for > 4s, reload cleanly.
  setTimeout(function() {
    var splash = document.getElementById("d-splash");
    if (splash && !document.querySelector(".ember-application")) {
      if (!sessionStorage.getItem("fkb_splash_reloaded")) {
        sessionStorage.setItem("fkb_splash_reloaded", "1");
        window.location.reload(true);
      }
    }
  }, 4000);
})();
</script>
